[package]
name = "bevy_burn_pacman"
version = "0.1.0"
edition = "2024"
authors = ["Jameson Beyrer <jbeyr+zqa9h8bg@proton.me>"]
license = "MIT OR Apache-2.0"
description = "Project 04: Pac-Man Lite - dense rewards, scripted ghost adversaries, and DQN in Bevy 0.19 + Burn 0.21"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "warn"
wildcard_enum_match_arm = "deny"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
cast_lossless = "allow"
doc_markdown = "allow"

[dependencies]
bevy = "0.19"
burn = { version = "0.21.0", features = ["train", "ndarray"] }
burn-ndarray = "0.21.0"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
proptest = "1.6"
